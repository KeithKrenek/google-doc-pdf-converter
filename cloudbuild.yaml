steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/google-doc-pdf-converter:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/google-doc-pdf-converter:latest'
      - '.'
    timeout: 600s

  # Push the container image with build ID
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/google-doc-pdf-converter:$BUILD_ID'

  # Push the container image with latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/google-doc-pdf-converter:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'google-doc-pdf-converter'
      - '--image'
      - 'gcr.io/$PROJECT_ID/google-doc-pdf-converter:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '900'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--set-env-vars'
      - 'BUCKET_NAME=${_BUCKET_NAME},PROJECT_ID=$PROJECT_ID'
      - '--set-secrets'
      - 'GOOGLE_CREDENTIALS_JSON=${_SECRET_NAME}:latest'

# Substitution variables with defaults
substitutions:
  _REGION: 'us-central1'
  _BUCKET_NAME: '${PROJECT_ID}-pdf-assets'
  _SECRET_NAME: 'google-doc-converter-credentials'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Build timeout (15 minutes)
timeout: '900s'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/google-doc-pdf-converter:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/google-doc-pdf-converter:latest'
